name: Verbesserung vorschlagen
description: Eine konkrete Verbesserung vorschlagen.
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem würde die Änderung lösen?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Gewünschtes Verhalten
      description: Beschreibe das Ergebnis für die Nutzung und gegebenenfalls erwogene Alternativen.
    validations:
      required: true
