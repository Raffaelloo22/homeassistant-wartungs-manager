name: Fehler melden
description: Ein reproduzierbares Problem mit dem Wartungs-Manager melden.
body:
  - type: markdown
    attributes:
      value: Bitte entferne Zugriffstoken, Seriennummern, Namen aus dem Haushalt und weitere private Angaben aus Protokollen und Bildschirmfotos.
  - type: input
    id: version
    attributes:
      label: Version des Wartungs-Managers
    validations:
      required: true
  - type: input
    id: homeassistant
    attributes:
      label: Home-Assistant-Version und Installationsart
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      description: Beschreibe das erwartete Verhalten und was tatsächlich passiert ist.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Anonymisierte Protokolle oder Bildschirmfotos
      description: Füge keinen echten Verzeichnisexport und keine Home-Assistant-Sicherung bei.
