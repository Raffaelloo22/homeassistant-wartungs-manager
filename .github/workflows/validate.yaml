name: Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Domain regression tests
        run: python -m unittest discover -s tests -q
      - name: Frontend regression tests
        run: |
          set -euo pipefail
          node --check custom_components/ha_wartung/frontend/panel.js
          for testfile in tests/test_frontend_*.cjs; do node "$testfile"; done
      - name: Check whitespace
        run: git diff --check
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  real-home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2026.11.0', '2026.11.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Pull official Home Assistant image
        run: docker pull ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - name: Fresh install and real lifecycle tests
        run: python scripts/test_ha_lifecycle.py --version '${{ matrix.version }}'
